[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"

# The TanStack adapter generates the server function and routing manifest.
# Direct page requests and real 404 responses are handled by that function.

[[redirects]]
  from = "https://www.ra2travelandtours.co.za/*"
  to = "https://ra2travelandtours.co.za/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ra2travelandtours.co.za/*"
  to = "https://ra2travelandtours.co.za/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ra2travelandtours.co.za/*"
  to = "https://ra2travelandtours.co.za/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
